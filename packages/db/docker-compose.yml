name: idea-sieve

services:
  postgres:
    image: postgres
    container_name: idea-sieve-postgres
    environment:
      POSTGRES_DB: idea-sieve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - idea-sieve_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  idea-sieve_postgres_data:
