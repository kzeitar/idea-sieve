version: '3.8'

# ============================================================================
# IDEA SIEVE - DOCKER COMPOSE CONFIGURATION (PRODUCTION)
# ============================================================================
# This file defines the complete application stack:
# - PostgreSQL database
# - Hono backend (API server)
# - React frontend (web application)
#
# Quick Start:
# 1. Copy .env.example to .env and add your API keys
# 2. Run: docker-compose up
# 3. Access the app at http://localhost:3001
# ============================================================================

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: idea-sieve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idea-sieve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - idea-sieve-network

  # ==========================================================================
  # Backend API Server (Hono + Bun)
  # ==========================================================================
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: idea-sieve-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@postgres:5432/idea-sieve}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - idea-sieve-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Frontend Web Application (React + Vite)
  # ==========================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:3000}
    container_name: idea-sieve-web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:3000}
    ports:
      - "3001:80"
    networks:
      - idea-sieve-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# ============================================================================
# Networks
# ============================================================================
networks:
  idea-sieve-network:
    driver: bridge

# ============================================================================
# Volumes (for persistent data)
# ============================================================================
volumes:
  postgres_data:
    driver: local
